<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e5443" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="لهجتي" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="افهم كل عربي، من النيل إلى الفرات. جمل الحياة اليومية بلهجات العرب كلّها، ومعها أشهر ما يقوله أهل كل لهجة. Lahjaty: understand every Arab, from the Nile to the Euphrates." />
    <meta property="og:image" content="/og-default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>لهجتي – Lahjaty | افهم كل عربي، من النيل إلى الفرات</title>
    <script>
      try {
        var s = (JSON.parse(localStorage.getItem('lahjaty:v1') || '{}').state) || {}
        var t = s.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      body { margin: 0; background: #fbf8f1; }
      .dark body { background: #0d1413; }
      .shell-bar { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: linear-gradient(135deg, #0e5443, #08302a); }
      .shell-logo { width: 36px; height: 36px; border-radius: 12px; background: #c99a3e; opacity: 0.85; }
      .shell-main { max-width: 42rem; margin: 0 auto; padding: 16px; }
      .shell-hero { border-radius: 2rem; padding: 20px; background: linear-gradient(135deg, #0e5443, #08302a); display: flex; flex-direction: column; gap: 12px; min-height: 220px; box-sizing: border-box; }
      .shell-line { display: block; height: 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); }
      .shell-line.big { height: 22px; }
      .shell-line.gold { background: rgba(243, 220, 156, 0.45); }
      .shell-card { height: 88px; margin-top: 14px; border-radius: 1rem; background: #f5eedf; }
      .dark .shell-card { background: #17201f; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts, then replaced. Plain styles so it paints before any script. -->
      <div class="shell" aria-hidden="true">
        <div class="shell-bar"><span class="shell-logo"></span><span class="shell-line" style="width: 5rem"></span></div>
        <div class="shell-main">
          <div class="shell-hero"><span class="shell-line gold" style="width: 40%"></span><span class="shell-line big" style="width: 85%"></span><span class="shell-line big" style="width: 60%"></span><span class="shell-line" style="width: 90%"></span></div>
          <div class="shell-card"></div>
          <div class="shell-card"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
